# Build the project and its Verso blueprint, and publish the site to GitHub Pages.
# Pages must use "GitHub Actions" as its source (Settings → Pages).
name: Blueprint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a run that is deploying is never cancelled.
concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the project and the blueprint site
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install elan
        run: |
          curl -sSfL -o elan-init.sh \
            https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the project's toolchain
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Restore Lake packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-packages-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Restore the project's build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/build
          key: ${{ runner.os }}-lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ hashFiles('*.lean', 'RokickiConstant/**', 'RokickiConstantPNT/**', 'Comparator/**', 'blueprint/**', 'vendor/**') }}
          restore-keys: |
            ${{ runner.os }}-lake-build-v2-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Get Mathlib's prebuilt cache
        run: lake exe cache get

      # The kernel replay of the blueprint site's build (`lake exe vbp build`) holds several
      # modules' worth of data in one checker process; give it swap beyond the runner's memory.
      - name: Add swap
        run: |
          sudo fallocate -l 32G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -m
          (while true; do date -u +%T; free -m | sed -n 2,3p; sleep 30; done > /tmp/memory.log 2>&1 &)

      - name: Build the project and the blueprint site
        run: ./scripts/ci-pages.sh

      - name: Memory use during the build
        if: always()
        run: cat /tmp/memory.log || true

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _out/site/html-multi

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
