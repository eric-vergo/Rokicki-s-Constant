name = "RokickiConstant"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RokickiConstant", "Comparator"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = true
doc.verso = true
weak.doc.verso.suggestions = false

# The blueprint tool chain, from the eric-vergo forks of Verso Blueprint, Verso and SubVerso
# (all for Lean v4.36.0). The fork of Verso Blueprint adds the side-by-side layout, build-time
# math, the Project Stats page and the Comparator headline; it is pinned to a commit of its
# `v4.36.0` branch. Verso and SubVerso are required here, before Verso Blueprint, so that the
# workspace uses these revisions: Verso's `release/v4.36.0` branch and the SubVerso commit Verso
# Blueprint pins.
# Only used by the `RokickiBlueprint` library and the `BlueprintMain.lean` generator; see
# `blueprint/README.md`.
[[require]]
name = "subverso"
git = "https://github.com/eric-vergo/subverso"
rev = "4e04c61d96960d5a1461c6c870572ccb8b45a495"

[[require]]
name = "verso"
git = "https://github.com/eric-vergo/verso"
rev = "94cea086b880f61f5b3847d30151b8e5f80e1259"

[[require]]
name = "VersoBlueprint"
git = "https://github.com/eric-vergo/verso-blueprint"
rev = "29d7bff6de00c53b0cd06aeb4c1349a801fe2e05"

# Mathlib is required last so that its pins of shared dependencies (ProofWidgets, Plausible)
# take precedence over VersoBlueprint's when Lake resolves the workspace.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.36.0"

[[lean_lib]]
name = "RokickiConstant"

[[lean_lib]]
name = "Comparator"
roots = ["Comparator.RhoIrrational.Solution"]

[[lean_lib]]
name = "ComparatorChallenge"
roots = ["Comparator.RhoIrrational.Challenge"]

# The part of PrimeNumberTheoremAnd (https://github.com/AlexKontorovich/PrimeNumberTheoremAnd)
# that proves the prime number theorem in arithmetic progressions (`WeakPNT_AP`), vendored in
# `vendor/` with its LeanArchitect annotations removed; see `vendor/README.md`. Only used by
# `RokickiConstantPNT`. Generated by `scripts/vendor-pnt.py`; do not edit.
[[lean_lib]]
name = "PrimeNumberTheoremAnd"
srcDir = "vendor"

# The upstream sources are not written against this project's linters or Verso docstrings.
[lean_lib.leanOptions]
doc.verso = false
weak.linter.mathlibStandardSet = false
weak.linter.style.longLine = false

# The second proof of the main theorem, by the prime number theorem in arithmetic progressions
# (not a default target: `lake build` does not build it). Build it with
# `lake build RokickiConstantPNT`.
[[lean_lib]]
name = "RokickiConstantPNT"

# The Verso blueprint document (not a default target: `lake build` does not build it).
# Build the site with `lake exe vbp build`; see `blueprint/README.md`.
[[lean_lib]]
name = "RokickiBlueprint"
srcDir = "blueprint"

[lean_lib.leanOptions]
experimental.module = true
weak.linter.mathlibStandardSet = false
# Blueprint directive lines (labels, Lean names, dependencies) are inherently long.
weak.linter.style.longLine = false
# Make a misspelled `(lean := "...")` declaration name an error rather than a warning.
weak.verso.blueprint.externalCode.strictResolve = true
