name = "RokickiConstant"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RokickiConstant", "Comparator"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = true
doc.verso = true
weak.doc.verso.suggestions = false

# Verso Blueprint (https://github.com/leanprover/verso-blueprint), pinned to the head of its
# `v4.34.0` release branch, whose `lean-toolchain` is `leanprover/lean4:v4.34.1`.
# It pulls in Verso, SubVerso and verso-slides. Only used by the `RokickiBlueprint` library
# and the `BlueprintMain.lean` generator; see `blueprint/README.md`.
[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "a1cf70667112dcffe15faea9f8783e63dd9644e8"

# PrimeNumberTheoremAnd (https://github.com/AlexKontorovich/PrimeNumberTheoremAnd), pinned to its
# `v4.34.0` tag. Only used by the `RokickiConstantPNT` library, the second proof of the main
# theorem, for the prime number theorem in arithmetic progressions (`WeakPNT_AP`).
[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
rev = "c39a751132c88b6e8080b74c74023fd95b3d8be0"

# Mathlib is required last so that its pins of shared dependencies (ProofWidgets, Plausible)
# take precedence over VersoBlueprint's when Lake resolves the workspace.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "RokickiConstant"

[[lean_lib]]
name = "Comparator"
roots = ["Comparator.Solution"]

[[lean_lib]]
name = "ComparatorChallenge"
roots = ["Comparator.Challenge"]

# The second proof of the main theorem, by the prime number theorem in arithmetic progressions
# (not a default target: `lake build` does not build it or PrimeNumberTheoremAnd).
# Build it with `lake build RokickiConstantPNT`.
[[lean_lib]]
name = "RokickiConstantPNT"

# The Verso blueprint document (not a default target: `lake build` does not build it).
# Build the site with `lake exe vbp build`; see `blueprint/README.md`.
[[lean_lib]]
name = "RokickiBlueprint"
srcDir = "blueprint"

[lean_lib.leanOptions]
experimental.module = true
weak.linter.mathlibStandardSet = false
# Blueprint directive lines (labels, Lean names, dependencies) are inherently long.
weak.linter.style.longLine = false
# Make a misspelled `(lean := "...")` declaration name an error rather than a warning.
weak.verso.blueprint.externalCode.strictResolve = true
